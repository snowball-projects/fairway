[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.6.0"
description = "A group golf-course chooser ranked by road travel time."
authors = [{name = "snowball"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gunicorn>=26.2,<27",
  "networkx>=3.4,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "modo @ git+https://github.com/snowball-projects/modo.git@285d35c212f884b1d0b8efb15af906461c94ee1e",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.scripts]
fairway-fetch-snapshot = "fairway.fetch:main"

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/fairway/fetch.py" = ["S310"] # URL and redirect targets are HTTPS-validated.
