[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.2.0"
description = "A minimal dashboard for fair geographic meeting regions."
authors = [{name = "snowball"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gunicorn>=23,<24",
  "modo @ git+https://github.com/snowball-projects/modo.git@63ed701b7c1c34fadebcd9ba30e4ae8e1dde3dd5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
