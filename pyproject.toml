[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.4.0"
description = "A group golf-course chooser ranked by road travel time."
authors = [{name = "snowball"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gunicorn>=23,<24",
  "networkx>=3.4,<4",
  "modo @ git+https://github.com/snowball-projects/modo.git@59770f98c59db66298aba3318e1cf05af104deb9",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
