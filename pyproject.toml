[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.6.2"
description = "A group golf-course chooser ranked by road travel time."
authors = [{ name = "Nas Delevski" }]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gunicorn>=26.2,<27",
  "networkx>=3.4,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "modo @ git+https://github.com/adelevski/modo.git@2996ffb229f65556512748d9f1d8ba25a8b9b87d",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.scripts]
fairway-fetch-snapshot = "fairway.fetch:main"

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/fairway/fetch.py" = ["S310"] # URL and redirect targets are HTTPS-validated.
