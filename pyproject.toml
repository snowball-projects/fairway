[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.4.1"
description = "A group golf-course chooser ranked by road travel time."
authors = [{name = "snowball"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gunicorn>=23,<24",
  "networkx>=3.4,<4",
  "modo @ git+https://github.com/snowball-projects/modo.git@1ac99fd81ce6027d3db4a7612c627851e547c76c",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/fetch_snapshot.py" = ["S310"] # URL and redirect targets are HTTPS-validated.
