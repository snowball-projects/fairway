[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairway"
version = "0.6.3"
description = "A static golf-course catalog with map browsing and nearby selection."
authors = [{ name = "Nas Delevski" }]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
backbone = ["osmium==4.3.2", "shapely==2.2.0"]
test = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/snowball-projects/fairway"

[tool.setuptools.package-data]
fairway = ["catalog_schema/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["catalog_integration: complete production catalog builds, run once in CI's catalog check"]
