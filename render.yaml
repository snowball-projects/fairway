services:
  - type: web
    name: fairway
    runtime: python
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: .venv/bin/gunicorn --preload --workers 1 --threads 4 fairway.app:application
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: FAIRWAY_GRAPH
        value: data/chicago-static-v1.npz
      - key: FAIRWAY_SNAPSHOT
        value: chicago-static-v1
      - key: FAIRWAY_TOMTOM_DAILY_CELLS
        value: "80"
