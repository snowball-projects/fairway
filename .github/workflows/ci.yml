name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install uv==0.12.6
      - run: uv sync --extra test --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: node --check src/fairway/static/app.js
      - run: node --check src/fairway/static/leaflet.js
      - run: uv run --locked python -m pytest
      - run: uv build --wheel
      - name: Smoke-test installed wheel command
        run: |
          python -m venv /tmp/fairway-wheel
          /tmp/fairway-wheel/bin/pip install --no-deps dist/fairway-*.whl
          /tmp/fairway-wheel/bin/fairway-fetch-snapshot --help
      - if: matrix.python-version == '3.13'
        run: uv run --locked python scripts/fetch_snapshot.py
      - if: matrix.python-version == '3.13'
        run: uv run --locked python scripts/validate_snapshot.py
      - if: matrix.python-version == '3.13'
        run: uv run --locked python scripts/build_course_index.py /tmp/fairway-courses.npz
      - if: matrix.python-version == '3.13'
        run: uv run --locked python scripts/validate_snapshot.py --course-index /tmp/fairway-courses.npz
