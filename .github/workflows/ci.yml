name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked test tools
        run: |
          python -m pip install uv==0.12.18
          uv sync --extra test --extra backbone --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Catalog source, identity and geometry invariants
        run: uv run --locked --extra backbone python -m pytest tests/test_backbone.py tests/test_catalog_rebuild.py
      - run: uv run --locked python scripts/export_catalog.py --check
      - name: Complete deterministic Pages integration
        run: uv run --locked python -m pytest --strict-markers tests/test_build_pages.py -m catalog_integration
      - name: Browser behavior
        run: |
          node --check src/fairway/static/app.js
          node --check src/fairway/static/leaflet.js
          node --test --test-isolation=none tests/*.test.mjs

  verify:
    needs: catalog
    if: always()
    runs-on: ubuntu-latest
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            check-name: verify
          - python-version: "3.12"
            check-name: verify-python-3.12
    steps:
      - name: Require catalog checks
        run: test "${{ needs.catalog.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.18
          uv sync --extra test --locked
      - name: Python behavior
        run: uv run --locked python -m pytest --strict-markers -m 'not catalog_integration'
      - name: Build distribution artifacts
        run: uv build

  pages:
    needs: [catalog, verify]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.catalog.result == 'success' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build current catalog browsing
        run: python scripts/build_pages.py --output _site --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
