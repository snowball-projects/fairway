name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Generated catalog edits are hash-validated without installing the app.
  catalog:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      experiment: ${{ steps.changes.outputs.experiment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app=false
          experiment=false
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            app=true
            experiment=true
          else
            git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                data/catalog-release/*|data/README.md|CHANGELOG.md) : ;;
                experiments/catalog-expansion/*) experiment=true ;;
                .github/workflows/*) app=true; experiment=true ;;
                *) app=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "experiment=$experiment" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate native generated catalog identity
        run: python scripts/build_pages.py --output "$RUNNER_TEMP/catalog-validation" --commit "$GITHUB_SHA"
      - name: Check deterministic Pages assembly
        run: python scripts/build_pages.py --output "$RUNNER_TEMP/catalog-repro" --commit "$GITHUB_SHA"

  verify:
    needs: catalog
    if: needs.catalog.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: bash scripts/build.sh
      - run: uv sync --extra test --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: node --check src/fairway/static/app.js
      - run: node --check src/fairway/static/leaflet.js
      - run: node --check docs/research-map/app.mjs
      - run: node --check docs/research-map/model.mjs
      - run: node --check docs/research-map/refresh.mjs
      - run: node --test tests/*.test.mjs
      - run: uv run --locked python -m pytest
      - run: uv build
      - name: Smoke-test installed wheel command
        run: |
          python -m venv /tmp/fairway-wheel
          /tmp/fairway-wheel/bin/pip install --no-deps dist/fairway-*.whl
          /tmp/fairway-wheel/bin/fairway-fetch-snapshot --help
      - name: Test extracted source distribution
        run: |
          mkdir "$RUNNER_TEMP/fairway-source"
          tar -xzf dist/fairway-*.tar.gz -C "$RUNNER_TEMP/fairway-source" --strip-components=1
          cd "$RUNNER_TEMP/fairway-source"
          bash scripts/build.sh
          uv sync --extra test --locked
          env -u PYTHONPATH uv run --locked python -m pytest
          node --test tests/*.test.mjs
      - run: uv run --locked python scripts/validate_snapshot.py
      - run: uv run --locked python scripts/build_course_index.py /tmp/fairway-courses.npz
      - run: uv run --locked python scripts/validate_snapshot.py --course-index /tmp/fairway-courses.npz

  catalog-experiment:
    needs: catalog
    if: needs.catalog.outputs.experiment == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
        working-directory: experiments/catalog-expansion

  pages:
    needs: [catalog, verify]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.catalog.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build current catalog browsing
        run: python scripts/build_pages.py --output _site --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
